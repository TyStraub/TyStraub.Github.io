<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Table</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #232425;
            color: white;
            font-family: Arial, sans-serif;
        }
        .main2 {
            display: grid;

            gap: 0px;
            background-color: green;
            padding: 5px;
            border-radius: 10px;
        }
        .main {
            display: grid;
            grid-template-columns: repeat(12, 60px);
            gap: 0px;
            background-color: green;
            padding: 10px;
            border-radius: 10px;
            justify-content: right;
        }
        .betRow1 {
            display: grid;
            grid-template-columns: repeat(3, 246px);
            justify-content: right;
            gap: 0px;
            background-color: green;
            padding-right: 10px;
            border-radius: 10px;
        }
        .betRow2 {
            display: grid;
            grid-template-columns: repeat(6, 126px);
            justify-content: right;
            gap: 0px;
            background-color: green;
            padding-right: 10px;
            border-radius: 10px;
        }
        .cell {
            width: 60px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid white;
        }
        .red { background-color: red; }
        .black { background-color: black; }
        .green { background-color: green;}
        .cbet1{width: 240px;;}
        .cbet2{width: 120px;;}
    </style>
</head>
<body>
    <div>
        <div class="main2">
            <div style="justify-content:space-between; display: flex;">
                <div style="padding-top: 10px;">
                    <div class="cell green" style="height: 62px;">0</div>
                    <div class="cell green" style="height: 62px;">00</div>
                </div>
                <div class="main">
                    <div class="cell red">3</div>
                    <div class="cell black">6</div>
                    <div class="cell red">9</div>
                    <div class="cell red">12</div>
                    <div class="cell black">15</div>
                    <div class="cell red">18</div>
                    <div class="cell red">21</div>
                    <div class="cell black">24</div>
                    <div class="cell red">27</div>
                    <div class="cell red">30</div>
                    <div class="cell black">33</div>
                    <div class="cell red">36</div>
                    <div class="cell black">2</div>
                    <div class="cell red">5</div>
                    <div class="cell black">8</div>
                    <div class="cell black">11</div>
                    <div class="cell red">14</div>
                    <div class="cell black">17</div>
                    <div class="cell black">20</div>
                    <div class="cell red">23</div>
                    <div class="cell black">26</div>
                    <div class="cell black">29</div>
                    <div class="cell red">32</div>
                    <div class="cell black">35</div>
                    <div class="cell red">1</div>
                    <div class="cell black">4</div>
                    <div class="cell red">7</div>
                    <div class="cell black">10</div>
                    <div class="cell black">13</div>
                    <div class="cell red">16</div>
                    <div class="cell red">19</div>
                    <div class="cell black">22</div>
                    <div class="cell red">25</div>
                    <div class="cell black">28</div>
                    <div class="cell black">31</div>
                    <div class="cell red">34</div>
                </div>
        </div>
            <div class="betRow1">
                <div class="cell cbet1">1-12</div>
                <div class="cell cbet1">13-24</div>
                <div class="cell cbet1">25-36</div>
            </div>
            <div class="betRow2">
                <div class="cell cbet2">1-18</div>
                <div class="cell cbet2">EVEN</div>
                <div class="cell red cbet2">RED</div>
                <div class="cell black cbet2">BLACK</div>
                <div class="cell cbet2">ODD</div>
                <div class="cell cbet2">19-36</div>
            </div>
        </div>

    </div>
</body>
</html>
